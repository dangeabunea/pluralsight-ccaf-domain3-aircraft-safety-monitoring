<div class="relative rounded-xl border overflow-hidden flex-1"
     style="background: var(--color-nav-active-bg); border-color: var(--color-border); box-shadow: var(--shadow-card);">

  <!-- Coloured top accent bar -->
  <div class="absolute top-0 left-0 right-0 h-[3px] rounded-t-xl"
       [style.background]="colour() === 'blue'
         ? 'linear-gradient(90deg, #4a9eff, #2563eb)'
         : 'linear-gradient(90deg, #f5a623, #d97706)'">
  </div>

  <div class="p-7 pt-8">
    <!-- Header row: label + icon box -->
    <div class="flex items-start justify-between mb-4">
      <span class="text-xs font-semibold uppercase tracking-widest"
            style="color: var(--color-text-secondary);">{{ label() }}</span>

      <div class="rounded-lg p-2" style="background: var(--color-card-bg);">
        @if (colour() === 'blue') {
          <!-- Clock icon for Pending Review -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="#4a9eff" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        } @else {
          <!-- Flag icon for Escalated -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="#f5a623" stroke-width="2" aria-hidden="true">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
        }
      </div>
    </div>

    <!-- Count + subtitle (stacked) -->
    <div class="mb-5">
      <span class="font-bold tabular-nums leading-none block"
            style="font-size: 52px;"
            [style.color]="colour() === 'blue' ? '#4a9eff' : '#f5a623'">
        {{ count() ?? '--' }}
      </span>
      <span class="text-sm mt-1 block"
            style="color: #334155;">
        {{ subtitle() }}
      </span>
    </div>

    <!-- Divider + CTA link -->
    <div class="border-t pt-4 flex items-center gap-1.5"
         style="border-color: var(--color-border);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           [attr.stroke]="colour() === 'blue' ? '#4a9eff' : '#f5a623'"
           stroke-width="2" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
      <a [routerLink]="routerLink()"
         class="text-sm font-semibold"
         [style.color]="colour() === 'blue' ? '#4a9eff' : '#f5a623'">
        {{ linkLabel() }}
      </a>
    </div>
  </div>
</div>
