<div class="p-7">

  <!-- Page header -->
  <div class="flex items-center gap-3 mb-6">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="var(--color-nav-active-text)" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <div>
      <h1 class="text-xl font-semibold m-0" style="color: var(--color-text-primary);">Safety Events</h1>
      <p class="text-sm m-0" style="color: var(--color-text-secondary);">Review and triage detected safety events</p>
    </div>
  </div>

  <app-events-table
    [events]="events()"
    [tab]="tab()"
    [loading]="loading()"
    [page]="page()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pendingCount]="pendingCount()"
    [escalatedCount]="escalatedCount()"
    (tabChange)="switchTab($event)"
    (view)="onView($event)"
    (pageChange)="goToPage($event)"
  />

</div>
