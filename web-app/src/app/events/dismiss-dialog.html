<div class="rounded-xl overflow-hidden"
     style="background: var(--color-topbar); border: 1px solid var(--color-border);">

  <!-- Header -->
  <div class="flex items-center gap-3 px-5 py-4 border-b"
       style="border-color: var(--color-border);">
    <div class="flex items-center justify-center w-8 h-8 rounded-lg flex-shrink-0"
         style="background: #fef2f2;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
    </div>
    <div>
      <h2 class="text-sm font-semibold m-0" style="color: var(--color-text-primary);">Dismiss Event</h2>
      <p class="text-xs m-0 mt-0.5" style="color: var(--color-text-subtle);">This action cannot be undone</p>
    </div>
  </div>

  <!-- Body -->
  <div class="px-5 py-5">
    <p class="text-sm m-0" style="color: var(--color-text-secondary);">
      Are you sure you want to dismiss this event?
    </p>
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-end gap-2 px-5 py-4 border-t"
       style="border-color: var(--color-border);">
    <button
      type="button"
      class="text-xs px-4 py-2 rounded-lg border transition-colors"
      style="background: var(--color-card-bg); color: var(--color-text-secondary); border-color: var(--color-border);"
      [disabled]="submitting()"
      (click)="cancel()">
      Cancel
    </button>
    <button
      type="button"
      class="text-xs px-4 py-2 rounded-lg border transition-colors"
      style="border-color: #fecaca;"
      [style.background]="submitting() ? 'var(--color-card-bg)' : '#fef2f2'"
      [style.color]="submitting() ? 'var(--color-text-subtle)' : '#dc2626'"
      [disabled]="submitting()"
      (click)="confirm()">
      @if (submitting()) {
        Dismissing…
      } @else {
        Confirm Dismiss
      }
    </button>
  </div>

</div>
