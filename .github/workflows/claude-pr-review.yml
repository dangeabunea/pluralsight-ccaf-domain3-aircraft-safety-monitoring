name: Claude PR review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-code-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so claude can diff against the base branch

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # -p runs claude non-interactively (print mode): it answers once and exits.
      # Without -p, claude starts the interactive UI and waits for keyboard input,
      # which a CI runner never provides, so the job can stall until it times out.
      - name: Review changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          claude -p  "Review the changes in this branch against origin/$BASE_REF.
          Summarize what changed, list the main risks and maintainability issues."