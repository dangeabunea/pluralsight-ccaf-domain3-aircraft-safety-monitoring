# Server port.
server.port=38090

# Expose error details in HTTP error responses (dev/demo only).
# Note: Spring Boot 4 renamed the namespace from server.error.* to spring.web.error.*
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# MongoDB.
# Override with SPRING_MONGODB_URI env var in Docker Compose.
# Note: Spring Boot 4 renamed the namespace from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=mongodb://localhost:27017/atc_safety
