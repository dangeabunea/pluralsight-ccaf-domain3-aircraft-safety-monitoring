# Path to the radar dump JSON file.
# Override with RADAR_DUMP_FILE_PATH env var in Docker Compose (see deployment-view-v1.0.md).
radar.dump.file-path=${RADAR_DUMP_FILE_PATH:tools/radar-dump.json}

# Geographic coordinates of the radar installation.
# Both properties are required — the application will not start if either is absent.
# Paris CDG-area radar head (consistent with the synthetic radar dump test data).
radar.lat=48.8566
radar.lon=2.3522

# Kafka producer configuration.
# Override bootstrap-servers with SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker Compose.
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka topic for validated radar positions.
# Required — the application will not start if this property is absent.
# Override with RADAR_KAFKA_TOPIC env var if needed.
radar.kafka.topic=radar.validated-positions

# Inter-cycle delay applied between radar processing cycles (milliseconds).
# 0 (default) = maximum speed; suitable for testing and demos.
# Positive value = real-time cadence; set to the radar sweep interval (e.g. 4000 for 4s SSR).
# Negative values are rejected at startup.
# Override with RADAR_PROCESSING_INTER_CYCLE_DELAY_MS env var in Docker Compose.
radar.processing.inter-cycle-delay-ms=0
