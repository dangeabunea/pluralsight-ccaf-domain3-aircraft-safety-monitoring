# Kafka consumer configuration.
# Override bootstrap-servers with SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker Compose.
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=detection-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Deserialize to the local RadarPositionMessage — no shared library with the producer (SAD §7).
spring.kafka.consumer.properties.spring.json.value.default.type=com.atcsafety.detection.application.RadarPositionMessage
# Ignore __TypeId__ headers stamped by the producer (com.atcsafety.radar.*) — class absent on this classpath.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# MongoDB.
# Override with SPRING_MONGODB_URI env var in Docker Compose.
# Note: Spring Boot 4 renamed the namespace from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=mongodb://localhost:27017/atc_safety

# Kafka topic for radar.validated-positions consumption.
# Required — startup validation will be enforced in Task 02-F-2.
# Override with DETECTION_KAFKA_TOPIC env var in Docker Compose.
detection.kafka.topic=radar.validated-positions

# Separation thresholds.
# horizontalThresholdNm: simultaneous horizontal separation < 6.0 NM triggers infringement
# verticalThresholdFt: simultaneous vertical separation < 2500 ft triggers infringement
# Startup validation will be enforced in Task 02-E-1.
detection.horizontalThresholdNm=6.0
detection.verticalThresholdFt=2500

# Grace period: number of radar cycles a separation event stays in GRACE_PERIOD before closing.
# Default 3 cycles (ACTIVE → GRACE_PERIOD → CLOSED state machine; decision log 2026-03-21).
# Must be ≥ 1. Startup validation will be enforced in Task 02-E-2.
detection.gracePeriodCycles=3
